{% extends "base.html" %}
{% block title %}Edit Record — FruitVision{% endblock %}
{% block content %}
<h1>Edit Record #{{ record.id }}</h1>
<p class="meta">Logged {{ record.created_at }} · model: {{ record.member.replace('ensemble_', '')|upper }} · file: {{ record.filename or '—' }}</p>

<div class="card" style="max-width:480px; margin-top:16px;">
  <form method="post">
    <label for="fruit">Fruit</label>
    <select name="fruit" id="fruit">
      {% for f in fruits %}
      <option value="{{ f }}" {{ 'selected' if record.fruit == f }}>{{ f.capitalize() }}</option>
      {% endfor %}
    </select>

    <label for="label">Ripeness</label>
    <select name="label" id="label">
      {% for c in classes %}
      <option value="{{ c }}" {{ 'selected' if record.label == c }}>{{ c.capitalize() }}</option>
      {% endfor %}
    </select>

    <label for="confidence">Confidence (%)</label>
    <input type="number" step="0.1" min="0" max="100" name="confidence" id="confidence" value="{{ record.confidence }}">

    <label for="source">Source</label>
    <input type="text" name="source" id="source" value="{{ record.source or '' }}">

    <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
      <button type="submit">Save Changes</button>
      <a class="btn-outline btn" href="/history">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
