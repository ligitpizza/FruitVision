{% extends "base.html" %}
{% block title %}Edit Stock Entry — FruitVision{% endblock %}
{% block content %}
<h1>Edit Stock Entry #{{ record.id }}</h1>
<p class="meta">Logged {{ record.created_at }} · source: {{ record.source }}{% if record.track_tag %} · {{ record.track_tag }}{% endif %}</p>

<div class="card" style="max-width:480px; margin-top:16px;">
  <form method="post">
    <label for="fruit">Fruit</label>
    <select name="fruit" id="fruit">
      {% for f in fruits %}
      <option value="{{ f }}" {{ 'selected' if record.fruit == f }}>{{ f.capitalize() }}</option>
      {% endfor %}
    </select>

    <label for="label">Ripeness</label>
    <select name="label" id="label">
      {% for c in classes %}
      <option value="{{ c }}" {{ 'selected' if record.label == c }}>{{ c.capitalize() }}</option>
      {% endfor %}
    </select>

    <label for="quantity">Quantity</label>
    <input type="number" step="1" name="quantity" id="quantity" value="{{ record.quantity }}">

    <label for="note">Note</label>
    <input type="text" name="note" id="note" value="{{ record.note or '' }}">

    <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
      <button type="submit">Save Changes</button>
      <a class="btn-outline btn" href="/stock">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
